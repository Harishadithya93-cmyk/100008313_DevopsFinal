services:
  db:
    image: mariadb:11
    container_name: notes-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: notesdb
      MARIADB_USER: notes_user
      MARIADB_PASSWORD: notes_pass
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - notes-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    container_name: notes-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: notesdb
      DB_USER: notes_user
      DB_PASSWORD: notes_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notes-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  notes-net:
    name: notes-net

volumes:
  mariadb_data: