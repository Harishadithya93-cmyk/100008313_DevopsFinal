apiVersion: v1
kind: Pod
metadata:
  name: k6-loadtest
  namespace: notes
  labels:
    app: k6-loadtest
spec:
  restartPolicy: Never
  containers:
    - name: k6
      image: grafana/k6:latest
      command: ["/bin/sh", "-c"]
      args:
        - k6 run --out csv=/results/results.csv --summary-export=/results/summary.json /scripts/k6-script.js; sleep 3600
      env:
        - name: BASE_URL
          value: http://notes-app
      volumeMounts:
        - name: script
          mountPath: /scripts
        - name: results
          mountPath: /results
  volumes:
    - name: script
      configMap:
        name: k6-script
    - name: results
      emptyDir: {}